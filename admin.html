<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FireGuard - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f6fa;
            color: #222;
        }


        /* NAVBAR */

        .navbar {
            background: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #ddd;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
        }


        .logo span {
            color: #ff3b30;
        }


        .admin-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .logout {
            padding: 9px 18px;

            border: none;

            background: #ff3b30;

            color: white;

            border-radius: 6px;

            cursor: pointer;
        }


        .logout:hover {
            background: #d92d24;
        }


        /* MAIN */

        .container {
            padding: 30px;

            max-width: 1400px;

            margin: auto;
        }


        h1 {
            margin-bottom: 8px;
        }


        .subtitle {
            color: #777;

            margin-bottom: 30px;
        }


        /* STATISTICS */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.06);
        }


        .card h3 {
            color: #777;

            font-size: 15px;

            margin-bottom: 12px;
        }


        .number {
            font-size: 32px;

            font-weight: bold;
        }


        .danger {
            color: #ff3b30;
        }


        .warning {
            color: #ff9500;
        }


        .safe {
            color: #28a745;
        }


        /* SECTION */

        .section {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.06);

            margin-bottom: 25px;
        }


        .section h2 {
            margin-bottom: 20px;
        }


        /* ALERT */

        .alert {
            border: 1px solid #ddd;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 15px;
        }


        .alert-fire {
            border-left: 6px solid #ff3b30;
        }


        .alert-smoke {
            border-left: 6px solid #ff9500;
        }


        .alert-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .alert-title {
            font-size: 18px;

            font-weight: bold;
        }


        .badge {
            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .fire-badge {
            background: #ffe5e3;

            color: #ff3b30;
        }


        .smoke-badge {
            background: #fff0d5;

            color: #ff9500;
        }


        .alert-info {
            color: #555;

            line-height: 1.8;
        }


        .description {
            background: #f5f6fa;

            padding: 12px;

            border-radius: 7px;

            margin-top: 10px;
        }


        /* BUTTONS */

        .buttons {
            margin-top: 18px;
        }


        .btn {
            padding: 10px 16px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            margin-right: 8px;
        }


        .notify {
            background: #ff3b30;

            color: white;
        }


        .notify:hover {
            background: #d92d24;
        }


        .resolve {
            background: #28a745;

            color: white;
        }


        .resolve:hover {
            background: #218838;
        }


        /* EMPTY */

        .empty {
            color: #777;

            text-align: center;

            padding: 40px 20px;
        }


        /* SOCIETY */

        .society-info {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }


        .info-box {
            background: #f5f6fa;

            padding: 18px;

            border-radius: 8px;
        }


        .info-box strong {
            display: block;

            font-size: 24px;

            margin-bottom: 5px;
        }


        .info-box span {
            color: #777;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .society-info {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .society-info {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .navbar {
                padding: 15px;
            }

            .admin-area {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            🔥 Fire<span>Guard</span>
        </div>


        <div class="admin-area">

            <span>
                👤 Admin
            </span>


            <button
                class="logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>



    <!-- MAIN -->

    <div class="container">


        <h1>
            Admin Dashboard
        </h1>


        <p class="subtitle">
            Smart Society Fire Safety Management System
        </p>



        <!-- STATISTICS -->

        <div class="cards">


            <div class="card">

                <h3>
                    Active Fire Alerts
                </h3>

                <div
                    class="number danger"
                    id="fireCount">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Smoke Alerts
                </h3>

                <div
                    class="number warning"
                    id="smokeCount">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Buildings
                </h3>

                <div class="number">
                    4
                </div>

            </div>



            <div class="card">

                <h3>
                    Residents
                </h3>

                <div class="number">
                    128
                </div>

            </div>


        </div>



        <!-- ACTIVE ALERTS -->

        <div class="section">


            <h2>
                🚨 Active Alerts
            </h2>


            <div id="alertsContainer">

                <div class="empty">

                    Loading alerts...

                </div>

            </div>


        </div>



        <!-- SOCIETY OVERVIEW -->

        <div class="section">


            <h2>
                🏢 Society Overview
            </h2>


            <div class="society-info">


                <div class="info-box">

                    <strong>
                        4
                    </strong>

                    <span>
                        Buildings
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        20
                    </strong>

                    <span>
                        Total Floors
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        160
                    </strong>

                    <span>
                        Total Flats
                    </span>

                </div>


            </div>


        </div>


    </div>



    <!-- FIREBASE -->

    <script type="module">

    const notificationPermission = await Notification.requestPermission();

        if (notificationPermission === "granted") {
        console.log("Notifications enabled");
        }


        import {
            initializeApp
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";



        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot,
            doc,
            getDoc,
            updateDoc
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        /* FIREBASE CONFIG */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCI4pL8pfQJh_6hjspgw-19Btdn7dtHLx0",

            authDomain:
                "fireguard-5b48c.firebaseapp.com",

            projectId:
                "fireguard-5b48c",

            storageBucket:
                "fireguard-5b48c.firebasestorage.app",

            messagingSenderId:
                "582631223976",

            appId:
                "1:582631223976:web:167a48703115b6dc0a889d",

            measurementId:
                "G-4PJGR0P7D7"

        };



        /* INITIALIZE FIREBASE */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* CHECK ADMIN */

        onAuthStateChanged(
            auth,
            async (user) => {


                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }



                try {


                    const userDoc =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                user.uid
                            )
                        );



                    if (!userDoc.exists()) {

                        alert(
                            "User data not found."
                        );

                        await signOut(auth);

                        window.location.href =
                            "index.html";

                        return;

                    }



                    const userData =
                        userDoc.data();



                    if (userData.role !== "admin") {

                        alert(
                            "Access denied. Admin only."
                        );

                        window.location.href =
                            "index.html";

                        return;

                    }



                    /* ADMIN VERIFIED */

                    loadReports();


                }

                catch (error) {

                    console.error(error);

                    alert(
                        "Unable to verify admin."
                    );

                }

            }
        );



        /* LOAD REPORTS */

        function loadReports() {


            const reportsRef =
                collection(
                    db,
                    "reports"
                );



            const reportsQuery =
                query(
                    reportsRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );



            onSnapshot(
                reportsQuery,
                (snapshot) => {


                    const container =
                        document.getElementById(
                            "alertsContainer"
                        );


                    container.innerHTML = "";



                    let fireCount = 0;

                    let smokeCount = 0;

                    let activeReports = 0;



                    snapshot.forEach(
                        (reportDoc) => {


                            const report =
                                reportDoc.data();

        new Notification("🔥 FireGuard Alert", {
            body:
               "Fire detected at Building " +
               report.building +
               ", Floor " +
               report.floor +
               ", Flat " +
               report.flat,
             icon: "fire-icon.png"
        });



                            /* IGNORE RESOLVED REPORTS */

                            if (
                                report.status ===
                                "resolved"
                            ) {

                                return;

                            }



                            activeReports++;



                            if (
                                report.type ===
                                "fire"
                            ) {

                                fireCount++;

                            }



                            if (
                                report.type ===
                                "smoke"
                            ) {

                                smokeCount++;

                            }



                            /* CREATE ALERT */

                            const alert =
                                document.createElement(
                                    "div"
                                );



                            if (
                                report.type ===
                                "fire"
                            ) {

                                alert.className =
                                    "alert alert-fire";

                            }

                            else {

                                alert.className =
                                    "alert alert-smoke";

                            }



                            const title =
                                report.type ===
                                "fire"

                                ? "🔥 Fire Detected"

                                : "💨 Smoke Detected";



                            const badge =
                                report.type ===
                                "fire"

                                ? "FIRE"

                                : "SMOKE";



                            const description =
                                report.description ||
                                "No description provided";



                            alert.innerHTML = `

                                <div
                                    class="alert-header"
                                >

                                    <div
                                        class="alert-title"
                                    >

                                        ${title}

                                    </div>


                                    <span
                                        class="badge ${
                                            report.type === "fire"
                                                ? "fire-badge"
                                                : "smoke-badge"
                                        }"
                                    >

                                        ${badge}

                                    </span>

                                </div>



                                <div
                                    class="alert-info"
                                >

                                    <strong>
                                        Building:
                                    </strong>

                                    ${report.building}

                                    <br>


                                    <strong>
                                        Floor:
                                    </strong>

                                    ${report.floor}

                                    <br>


                                    <strong>
                                        Flat:
                                    </strong>

                                    ${report.flat}

                                    <br>


                                    <strong>
                                        Reported by:
                                    </strong>

                                    ${report.reporterEmail ||
                                    "Resident"}

                                    <div
                                        class="description"
                                    >

                                        <strong>
                                            Description:
                                        </strong>

                                        <br>

                                        ${description}

                                    </div>

                                </div>



                                <div
                                    class="buttons"
                                >

                                    <button
                                        class="btn notify"
                                        onclick="notifyResidents(
                                            '${report.building}',
                                            '${report.floor}',
                                            '${report.flat}'
                                        )"
                                    >

                                        📢 Notify Society

                                    </button>



                                    <button
                                        class="btn resolve"
                                        onclick="resolveAlert(
                                            '${reportDoc.id}'
                                        )"
                                    >

                                        ✓ Resolve

                                    </button>

                                </div>

                            `;



                            container.appendChild(
                                alert
                            );


                        }
                    );



                    /* UPDATE COUNTERS */

                    document.getElementById(
                        "fireCount"
                    ).textContent =
                        fireCount;



                    document.getElementById(
                        "smokeCount"
                    ).textContent =
                        smokeCount;



                    /* NO ALERTS */

                    if (
                        activeReports === 0
                    ) {

                        container.innerHTML = `

                            <div class="empty">

                                ✅ No active emergency reports.

                            </div>

                        `;

                    }


                },



                (error) => {

                    console.error(
                        "Firestore error:",
                        error
                    );


                    document.getElementById(
                        "alertsContainer"
                    ).innerHTML = `

                        <div class="empty">

                            ❌ Unable to load reports.

                            <br><br>

                            Check Firestore rules
                            and browser console.

                        </div>

                    `;

                }

            );

        }



        /* NOTIFY SOCIETY */

        window.notifyResidents =
            function(
                building,
                floor,
                flat
            ) {


                alert(

                    "🚨 FIREGUARD ALERT\n\n" +

                    "Emergency reported at:\n\n" +

                    "Building " +
                    building +

                    "\nFloor " +
                    floor +

                    "\nFlat " +
                    flat +

                    "\n\n" +

                    "Society notification triggered."

                );

            };



        /* RESOLVE ALERT */

        window.resolveAlert =
            async function(
                reportId
            ) {


                try {


                    await updateDoc(

                        doc(
                            db,
                            "reports",
                            reportId
                        ),

                        {

                            status:
                                "resolved"

                        }

                    );


                    alert(
                        "✅ Alert resolved."
                    );


                }

                catch (error) {


                    console.error(
                        error
                    );


                    alert(
                        "❌ Could not resolve alert."
                    );

                }

            };



        /* LOGOUT */

        window.logout =
            async function() {


                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }

                catch (error) {

                    console.error(error);

                }

            };


    </script>


</body>

</html>
