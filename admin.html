<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FireGuard - Admin Dashboard</title>


    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #080e1c;
            --panel: rgba(17, 27, 48, 0.94);
            --panel-soft: #14213a;
            --panel-hover: #192945;
            --text: #f4f7ff;
            --muted: #9ba9c3;
            --border: rgba(164, 183, 219, 0.16);
            --red: #ff513b;
            --red-soft: rgba(255, 81, 59, 0.13);
            --orange: #ff9a44;
            --green: #35d49a;
            --radius: 17px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(ellipse at 8% 0%, rgba(255, 81, 59, .11), transparent 34%),
                radial-gradient(ellipse at 92% 80%, rgba(56, 98, 203, .10), transparent 38%),
                var(--bg);
        }

        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }

        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 4px;
        }

        /* TOP NAVIGATION */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 17px clamp(18px, 4vw, 48px);
            background: rgba(8, 14, 28, .84);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text);
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--red);
            margin-left: -7px;
        }

        .admin-area {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--muted);
            font-size: 13px;
        }

        .admin-area > span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.035);
        }

        .logout {
            padding: 10px 17px;
            border: 1px solid rgba(255, 81, 59, .35);
            background: linear-gradient(110deg, #ff4938, #ff7044);
            color: white;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 7px 20px rgba(255, 73, 56, .18);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .logout:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 10px 25px rgba(255, 73, 56, .28);
        }

        .logout:active { transform: scale(.98); }

        /* PAGE LAYOUT */
        .container {
            width: min(1400px, 100%);
            padding: 36px clamp(16px, 4vw, 48px) 48px;
            margin: auto;
        }

        .container > h1 {
            margin-bottom: 9px;
            color: var(--text);
            font-size: clamp(27px, 3vw, 36px);
            line-height: 1.2;
            letter-spacing: -1.2px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 13px;
            line-height: 1.7;
        }

        /* STATISTIC CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .card {
            position: relative;
            overflow: hidden;
            min-height: 138px;
            padding: 23px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: linear-gradient(145deg, rgba(22, 35, 59, .97), rgba(13, 23, 41, .97));
            box-shadow: 0 12px 32px rgba(0, 0, 0, .15);
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
            animation: riseIn .45s ease both;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            top: -58px;
            right: -40px;
            border-radius: 50%;
            background: rgba(255,255,255,.035);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 154, 68, .32);
            box-shadow: 0 18px 38px rgba(0, 0, 0, .22);
        }

        .card h3 {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 17px;
        }

        .number {
            color: var(--text);
            font-size: 34px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .danger { color: #ff7567; }
        .warning { color: var(--orange); }
        .safe { color: var(--green); }

        /* MAIN SECTIONS */
        .section {
            padding: clamp(18px, 2.5vw, 28px);
            margin-bottom: 23px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: 0 14px 38px rgba(0, 0, 0, .14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: riseIn .5s ease both;
        }

        .section h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            color: var(--text);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.35px;
        }

        /* ALERT CARDS */
        .alert {
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--orange);
            border-radius: 13px;
            background: linear-gradient(130deg, rgba(24, 38, 63, .95), rgba(15, 26, 45, .95));
            transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
            animation: riseIn .35s ease both;
        }

        .alert:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 154, 68, .3);
            box-shadow: 0 12px 26px rgba(0, 0, 0, .16);
        }

        .alert-fire { border-left-color: var(--red); }
        .alert-smoke { border-left-color: var(--orange); }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 17px;
        }

        .alert-title {
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 11px;
            border: 1px solid transparent;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .7px;
        }

        .fire-badge {
            color: #ffaaa2;
            background: rgba(255, 81, 59, .13);
            border-color: rgba(255, 81, 59, .25);
        }

        .smoke-badge {
            color: #ffc27f;
            background: rgba(255, 154, 68, .12);
            border-color: rgba(255, 154, 68, .25);
        }

        .alert-info {
            color: #c2cde0;
            font-size: 13px;
            line-height: 1.95;
            overflow-wrap: anywhere;
        }

        .alert-info strong {
            color: #e9effb;
            font-weight: 600;
        }

        .description {
            margin-top: 12px;
            padding: 13px 15px;
            border: 1px solid rgba(164, 183, 219, .1);
            border-radius: 9px;
            background: rgba(5, 12, 25, .48);
            color: var(--muted);
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        /* ALERT ACTIONS */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            min-height: 39px;
            padding: 10px 14px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn:active { transform: scale(.98); }

        .notify {
            color: white;
            background: linear-gradient(110deg, #ff4938, #ff7044);
            box-shadow: 0 6px 17px rgba(255, 73, 56, .15);
        }

        .resolve {
            color: #7ce7bc;
            background: rgba(53, 212, 154, .1);
            border-color: rgba(53, 212, 154, .24);
        }

        .resolve:hover { background: rgba(53, 212, 154, .17); }

        /* EMPTY / LOADING STATE */
        .empty {
            padding: 38px 20px;
            border: 1px dashed rgba(164, 183, 219, .22);
            border-radius: 12px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            background: rgba(255, 255, 255, .018);
        }

        /* SOCIETY OVERVIEW */
        .society-info {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .info-box {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(7, 14, 28, .45);
            transition: border-color .2s ease, transform .2s ease;
        }

        .info-box:hover {
            border-color: rgba(115, 167, 255, .32);
            transform: translateY(-2px);
        }

        .info-box strong {
            display: block;
            color: var(--text);
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -.7px;
            margin-bottom: 8px;
        }

        .info-box span {
            color: var(--muted);
            font-size: 12px;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(9px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 14px 16px;
                gap: 10px;
            }

            .logo { font-size: 20px; }
            .admin-area { gap: 8px; font-size: 11px; }
            .admin-area > span { padding: 8px 9px; }
            .logout { padding: 9px 12px; }

            .container { padding: 27px 14px 35px; }
            .container > h1 { font-size: 27px; }
            .subtitle { margin-bottom: 22px; }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 11px;
                margin-bottom: 20px;
            }

            .card { min-height: 116px; padding: 17px; border-radius: 13px; }
            .card h3 { font-size: 11px; line-height: 1.5; margin-bottom: 13px; }
            .number { font-size: 29px; }

            .section { padding: 17px; margin-bottom: 17px; }
            .section h2 { font-size: 16px; margin-bottom: 17px; }
            .alert { padding: 15px; }
            .alert-title { font-size: 14px; }
            .alert-info { font-size: 12px; }
            .society-info { grid-template-columns: 1fr; gap: 10px; }
            .info-box { padding: 16px; }
            .info-box strong { font-size: 23px; }
            .buttons { gap: 8px; }
            .btn { flex: 1 1 auto; }
        }

        @media (max-width: 380px) {
            .cards { grid-template-columns: 1fr; }
            .admin-area > span { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            🔥 Fire<span>Guard</span>
        </div>


        <div class="admin-area">

            <span>
                👤 Admin
            </span>


            <button
                class="logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>



    <!-- MAIN -->

    <div class="container">


        <h1>
            Admin Dashboard
        </h1>


        <p class="subtitle">
            Smart Society Fire Safety Management System
        </p>



        <!-- STATISTICS -->

        <div class="cards">


            <div class="card">

                <h3>
                    Active Fire Alerts
                </h3>

                <div
                    class="number danger"
                    id="fireCount">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Smoke Alerts
                </h3>

                <div
                    class="number warning"
                    id="smokeCount">

                    0

                </div>

            </div>



            <div class="card">

                <h3>
                    Buildings
                </h3>

                <div class="number">
                    4
                </div>

            </div>



            <div class="card">

                <h3>
                    Residents
                </h3>

                <div class="number">
                    128
                </div>

            </div>


        </div>



        <!-- ACTIVE ALERTS -->

        <div class="section">


            <h2>
                🚨 Active Alerts
            </h2>


            <div id="alertsContainer">

                <div class="empty">

                    Loading alerts...

                </div>

            </div>


        </div>



        <!-- SOCIETY OVERVIEW -->

        <div class="section">


            <h2>
                🏢 Society Overview
            </h2>


            <div class="society-info">


                <div class="info-box">

                    <strong>
                        4
                    </strong>

                    <span>
                        Buildings
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        20
                    </strong>

                    <span>
                        Total Floors
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        160
                    </strong>

                    <span>
                        Total Flats
                    </span>

                </div>


            </div>


        </div>


    </div>



    <!-- FIREBASE -->

    <script type="module">

    const notificationPermission = await Notification.requestPermission();

        if (notificationPermission === "granted") {
        console.log("Notifications enabled");
        }


        import {
            initializeApp
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";



        import {
            getAuth,
            onAuthStateChanged,
            signOut
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot,
            doc,
            getDoc,
            updateDoc
        }

        from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



        /* FIREBASE CONFIG */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCI4pL8pfQJh_6hjspgw-19Btdn7dtHLx0",

            authDomain:
                "fireguard-5b48c.firebaseapp.com",

            projectId:
                "fireguard-5b48c",

            storageBucket:
                "fireguard-5b48c.firebasestorage.app",

            messagingSenderId:
                "582631223976",

            appId:
                "1:582631223976:web:167a48703115b6dc0a889d",

            measurementId:
                "G-4PJGR0P7D7"

        };



        /* INITIALIZE FIREBASE */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* CHECK ADMIN */

        onAuthStateChanged(
            auth,
            async (user) => {


                if (!user) {

                    window.location.href =
                        "index.html";

                    return;

                }



                try {


                    const userDoc =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                user.uid
                            )
                        );



                    if (!userDoc.exists()) {

                        alert(
                            "User data not found."
                        );

                        await signOut(auth);

                        window.location.href =
                            "index.html";

                        return;

                    }



                    const userData =
                        userDoc.data();



                    if (userData.role !== "admin") {

                        alert(
                            "Access denied. Admin only."
                        );

                        window.location.href =
                            "index.html";

                        return;

                    }



                    /* ADMIN VERIFIED */

                    loadReports();


                }

                catch (error) {

                    console.error(error);

                    alert(
                        "Unable to verify admin."
                    );

                }

            }
        );



        /* LOAD REPORTS */

        function loadReports() {


            const reportsRef =
                collection(
                    db,
                    "reports"
                );



            const reportsQuery =
                query(
                    reportsRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );



            onSnapshot(
                reportsQuery,
                (snapshot) => {


                    const container =
                        document.getElementById(
                            "alertsContainer"
                        );


                    container.innerHTML = "";



                    let fireCount = 0;

                    let smokeCount = 0;

                    let activeReports = 0;



                    snapshot.forEach(
                        (reportDoc) => {


                            const report =
                                reportDoc.data();

        new Notification("🔥 FireGuard Alert", {
            body:
               "Fire detected at Building " +
               report.building +
               ", Floor " +
               report.floor +
               ", Flat " +
               report.flat,
             icon: "fire-icon.png"
        });



                            /* IGNORE RESOLVED REPORTS */

                            if (
                                report.status ===
                                "resolved"
                            ) {

                                return;

                            }



                            activeReports++;



                            if (
                                report.type ===
                                "fire"
                            ) {

                                fireCount++;

                            }



                            if (
                                report.type ===
                                "smoke"
                            ) {

                                smokeCount++;

                            }



                            /* CREATE ALERT */

                            const alert =
                                document.createElement(
                                    "div"
                                );



                            if (
                                report.type ===
                                "fire"
                            ) {

                                alert.className =
                                    "alert alert-fire";

                            }

                            else {

                                alert.className =
                                    "alert alert-smoke";

                            }



                            const title =
                                report.type ===
                                "fire"

                                ? "🔥 Fire Detected"

                                : "💨 Smoke Detected";



                            const badge =
                                report.type ===
                                "fire"

                                ? "FIRE"

                                : "SMOKE";



                            const description =
                                report.description ||
                                "No description provided";



                            alert.innerHTML = `

                                <div
                                    class="alert-header"
                                >

                                    <div
                                        class="alert-title"
                                    >

                                        ${title}

                                    </div>


                                    <span
                                        class="badge ${
                                            report.type === "fire"
                                                ? "fire-badge"
                                                : "smoke-badge"
                                        }"
                                    >

                                        ${badge}

                                    </span>

                                </div>



                                <div
                                    class="alert-info"
                                >

                                    <strong>
                                        Building:
                                    </strong>

                                    ${report.building}

                                    <br>


                                    <strong>
                                        Floor:
                                    </strong>

                                    ${report.floor}

                                    <br>


                                    <strong>
                                        Flat:
                                    </strong>

                                    ${report.flat}

                                    <br>


                                    <strong>
                                        Reported by:
                                    </strong>

                                    ${report.reporterEmail ||
                                    "Resident"}

                                    <div
                                        class="description"
                                    >

                                        <strong>
                                            Description:
                                        </strong>

                                        <br>

                                        ${description}

                                    </div>

                                </div>



                                <div
                                    class="buttons"
                                >

                                    <button
                                        class="btn notify"
                                        onclick="notifyResidents(
                                            '${report.building}',
                                            '${report.floor}',
                                            '${report.flat}'
                                        )"
                                    >

                                        📢 Notify Society

                                    </button>



                                    <button
                                        class="btn resolve"
                                        onclick="resolveAlert(
                                            '${reportDoc.id}'
                                        )"
                                    >

                                        ✓ Resolve

                                    </button>

                                </div>

                            `;



                            container.appendChild(
                                alert
                            );


                        }
                    );



                    /* UPDATE COUNTERS */

                    document.getElementById(
                        "fireCount"
                    ).textContent =
                        fireCount;



                    document.getElementById(
                        "smokeCount"
                    ).textContent =
                        smokeCount;



                    /* NO ALERTS */

                    if (
                        activeReports === 0
                    ) {

                        container.innerHTML = `

                            <div class="empty">

                                ✅ No active emergency reports.

                            </div>

                        `;

                    }


                },



                (error) => {

                    console.error(
                        "Firestore error:",
                        error
                    );


                    document.getElementById(
                        "alertsContainer"
                    ).innerHTML = `

                        <div class="empty">

                            ❌ Unable to load reports.

                            <br><br>

                            Check Firestore rules
                            and browser console.

                        </div>

                    `;

                }

            );

        }



        /* NOTIFY SOCIETY */

        window.notifyResidents =
            function(
                building,
                floor,
                flat
            ) {


                alert(

                    "🚨 FIREGUARD ALERT\n\n" +

                    "Emergency reported at:\n\n" +

                    "Building " +
                    building +

                    "\nFloor " +
                    floor +

                    "\nFlat " +
                    flat +

                    "\n\n" +

                    "Society notification triggered."

                );

            };



        /* RESOLVE ALERT */

        window.resolveAlert =
            async function(
                reportId
            ) {


                try {


                    await updateDoc(

                        doc(
                            db,
                            "reports",
                            reportId
                        ),

                        {

                            status:
                                "resolved"

                        }

                    );


                    alert(
                        "✅ Alert resolved."
                    );


                }

                catch (error) {


                    console.error(
                        error
                    );


                    alert(
                        "❌ Could not resolve alert."
                    );

                }

            };



        /* LOGOUT */

        window.logout =
            async function() {


                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }

                catch (error) {

                    console.error(error);

                }

            };


    </script>


</body>

</html>
