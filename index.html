
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireGuard - Login</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div class="login-container">
        <div class="logo">🔥</div>

        <h1>FireGuard</h1>
        <p class="subtitle">Smart Society Fire Safety System</p>

        <!-- LOGIN FORM -->
        <section id="loginSection">
            <h2>Login to FireGuard</h2>

            <form id="loginForm">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <label for="role">Login As</label>
                <select id="role" required>
                    <option value="resident">Resident</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Login</button>
            </form>

            <p>
                New resident
                <a href="#" id="showRegister">Create an account</a>
            </p>
        </section>

        <!-- RESIDENT REGISTRATION FORM -->
        <section id="registerSection" hidden>
            <h2>Create Resident Account</h2>

            <form id="registerForm">
                <label for="regName">Full Name</label>
                <input
                    type="text"
                    id="regName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="regEmail">Email</label>
                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="regPassword">Password</label>
                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create a password (minimum 6 characters)"
                    minlength="6"
                    required
                >

                <label for="regBuilding">Building / Tower</label>
                <input
                    type="text"
                    id="regBuilding"
                    placeholder="Example: Tower A"
                    required
                >

                <label for="regFloor">Floor Number</label>
                <input
                    type="number"
                    id="regFloor"
                    placeholder="Enter floor number"
                    min="0"
                    required
                >

                <label for="regFlat">Flat Number</label>
                <input
                    type="text"
                    id="regFlat"
                    placeholder="Example: A-204"
                    required
                >

                <button type="submit">Create Account</button>
            </form>

            <p>
                Already registered?
                <a href="#" id="showLogin">Back to Login</a>
            </p>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="footer">
            <p>🚨 Stay Safe • Stay Alert</p>
        </div>
    </div>

    <script>
        const loginSection = document.getElementById("loginSection");
        const registerSection = document.getElementById("registerSection");
        const message = document.getElementById("message");

        document.getElementById("showRegister").addEventListener("click", function (event) {
            event.preventDefault();
            loginSection.hidden = true;
            registerSection.hidden = false;
            message.textContent = "";
        });

        document.getElementById("showLogin").addEventListener("click", function (event) {
            event.preventDefault();
            registerSection.hidden = true;
            loginSection.hidden = false;
            message.textContent = "";
        });
    </script>

    <script type="module" src="script1.js"></script>
</body>
</html>
